name: Python Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test against all Python versions supported in pyproject.toml
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          # Install dependencies as recommended in CONTRIBUTING.md
          uv sync --extra test

      - name: Run unit tests with pytest
        run: |
          source .venv/bin/activate
          # Run all tests in tests/unittests AND tests/plugins. The latter
          # was never covered here -- confirmed live, not assumed: CI never
          # ran a single test under tests/plugins/, including the existing
          # AgentGovernancePlugin and TaxonomyPlugin suites, since this
          # workflow only ever pointed at tests/unittests. Tests for any
          # plugin needing an optional extra not installed here skip
          # cleanly via pytest.importorskip rather than fail.
          pytest tests/unittests tests/plugins
